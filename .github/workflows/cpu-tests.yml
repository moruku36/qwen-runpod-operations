name: CPU contracts
on:
  push:
    branches: [main, 'work/**']
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -B -m pytest tests -q
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -B -m unittest discover -s tests
      - name: Native main CAS races
        shell: powershell
        run: ./tests/test_c2_main_cas.ps1
      - name: Native hook and exclusive-create races
        shell: powershell
        run: ./tests/test_c2_hook_races.ps1
